databases:
  - name: tirezone-db
    plan: free

services:
  - type: web
    name: tirezone-app
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: tirezone-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
